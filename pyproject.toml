[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codetodiagram"
version = "0.1.0"
description = "Generate Mermaid flowcharts from Python source by tracing call graphs from entry points."
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Fahd Shakir" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
codetodiagram = "codetodiagram.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codetodiagram"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["codetodiagram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
